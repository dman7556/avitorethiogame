<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Primary SEO (landing defaults; per-route pages override via usePageMeta) -->
    <title>Aviator — Crash Game | Play & Cash Out in Real Time</title>
    <meta name="description" content="Watch the curve climb and cash out before it crashes. Real-time provably fair Aviator rounds, instant ETB deposits and withdrawals, and 20 birr free to start." />
    <link rel="canonical" href="https://ethioaviator.com/" />

    <!-- Open Graph / social link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aviator" />
    <meta property="og:title" content="Aviator — Crash Game | Play & Cash Out in Real Time" />
    <meta property="og:description" content="Real-time provably fair Aviator rounds. Cash out before the curve crashes. 20 birr free to start." />
    <meta property="og:url" content="https://ethioaviator.com/" />
    <meta property="og:image" content="https://ethioaviator.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Aviator — the rising curve crash game" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aviator — Crash Game | Play & Cash Out in Real Time" />
    <meta name="twitter:description" content="Real-time provably fair Aviator rounds. Cash out before the curve crashes. 20 birr free to start." />
    <meta name="twitter:image" content="https://ethioaviator.com/og-image.png" />

    <!-- Structured data: who operates this (Organization) + what it is (honest WebApplication) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Aviator",
      "url": "https://ethioaviator.com/",
      "logo": "https://ethioaviator.com/favicon.svg",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "url": "https://ethioaviator.com/about"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Aviator",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Web",
      "url": "https://ethioaviator.com/",
      "description": "Real-time crash-style betting game. Provably fair rounds, ETB deposits and withdrawals. Real-money play - 18+ only.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "ETB" },
      "audience": {
        "@type": "PeopleAudience",
        "suggestedMinAge": 18
      }
    }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-sky-dark text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
