# Skyrush backend — nginx reverse proxy (Vercel frontend → Oracle backend)
#
# Public HTTPS terminates here; Node (:8080) is never exposed publicly.
# The $connection_upgrade map (below) makes Socket.IO websocket upgrades work.
#
# Install (on the VM, as root), with DOMAIN = the backend's DNS name:
#   sed "s/__DOMAIN__/${DOMAIN}/g" deploy/oracle/nginx-skyrush.conf \
#     > /etc/nginx/sites-available/skyrush
#   ln -sf /etc/nginx/sites-available/skyrush /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# Run certbot AFTER nginx serves the plain-HTTP vhost so it can edit this file:
#   certbot --nginx -d "${DOMAIN}" --redirect

# Required for websocket upgrade handling (Socket.IO)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Rate-limit zone aligned with the app's own express-rate-limit (defense in depth)
limit_req_zone $binary_remote_addr zone=skyrush_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Certbot HTTP-01 challenge lives here until HTTPS is issued
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    # ── TLS (certbot fills/updates these paths) ──
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Sensible security headers (backend CORS stays authoritative for browsers)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Long-lived connections for Socket.IO (idle ceiling above ping interval)
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Backend never sees more than one proxy hop (nginx) → matches app.set('trust proxy', 1)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Socket.IO — websocket upgrade + long-lived, unbuffered
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
    }

    # REST API
    location /api/ {
        limit_req zone=skyrush_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
    }

    # Legacy local deposit screenshots (until fully migrated to Cloudinary)
    location /uploads/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
    }

    # Everything else: 444 (no response) — the VM serves only this backend
    location / {
        return 444;
    }
}
